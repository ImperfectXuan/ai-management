# AI Workspace Secrets Permissions
# Define which tools can access which secrets
# This file is NOT encrypted - do not put actual secret values here
#
# Format:
#   - tool: <tool_name>
#     allowed_secrets: ["secret_key1", "secret_key2"]
#
# If a tool is not listed, it has no access to any secrets.
# If allowed_secrets is empty [], the tool has no secret access.

policies:
  - tool: codex
    allowed_secrets: []
  - tool: claude
    allowed_secrets: []
  - tool: cursor
    allowed_secrets: []
  - tool: trae
    allowed_secrets: []
